[project]
name = "ai-task-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JaneDoeCoding", email = "niuziting753@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.12,<5",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28,<1",
    "langgraph>=1.2.15",
    "openai>=3.23.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.20.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "rq>=2.12.0",
    "sqlalchemy>=2.1.1",
]

[project.scripts]
ai-task-manager = "ai_task_manager:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
